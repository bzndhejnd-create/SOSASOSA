<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои увлечения</title>
  <!-- Подключение современного шрифта Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Подключение таблицы стилей -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page-container">
    <div class="card">
      <span class="badge">Визитка</span>
      <h1 class="title">Мои увлечения</h1>
      <p id="intro-text" class="description">

      </p>
      <button id="action-btn" class="primary-btn">
        <span>Узнать больше ✨</span>
      </button>
      <div id="extra-info" class="extra-info hidden">
        <p>Каждый день — это возможность научиться чему-то новому и воплотить интересную идею в жизнь!</p>
      </div>
    </div>

  <!-- Подключение JavaScript-сценария -->
  <script src="script.js"></script>
